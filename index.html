<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Apply the saved theme before first paint so there is no flash.
      // Mirrors apply() in src/providers/ThemeProvider.tsx; the ids come
      // from src/lib/themes.ts.
      (() => {
        const darkBased = ['dark', 'dagobah', 'synthwave'];
        const palettes = ['dagobah', 'tatooine', 'synthwave'];
        let saved = null;
        try {
          saved = localStorage.getItem('holocron:theme');
        } catch {
          // Blocked storage: follow the OS.
        }
        const root = document.documentElement;
        const known = darkBased.includes(saved) || ['light', 'tatooine'].includes(saved);
        const dark = known
          ? darkBased.includes(saved)
          : matchMedia('(prefers-color-scheme: dark)').matches;
        root.classList.toggle('dark', dark);
        if (palettes.includes(saved)) root.dataset.theme = saved;
      })();
    </script>
    <meta
      name="description"
      content="The retro board that doesn't keep your retros. No accounts, no history. Erased from the archives, every morning."
    />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)" />
    <!-- Link previews. Self-hosters: point og:image at your own origin (docs/self-hosting.md). -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Holocron" />
    <meta
      property="og:description"
      content="The retro board that doesn't keep your retros. No accounts, no history. Erased from the archives, every morning."
    />
    <meta property="og:image" content="https://holocron.beskar.workers.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Holocron</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
