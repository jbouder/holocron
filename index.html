<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Apply the saved theme before first paint so there is no flash.
      // Mirrors apply() in src/providers/ThemeProvider.tsx; the ids come
      // from src/lib/themes.ts.
      (() => {
        const darkBased = ['dark', 'dagobah', 'synthwave'];
        const palettes = ['dagobah', 'tatooine', 'synthwave'];
        let saved = null;
        try {
          saved = localStorage.getItem('holocron:theme');
        } catch {
          // Blocked storage: follow the OS.
        }
        const root = document.documentElement;
        const known = darkBased.includes(saved) || ['light', 'tatooine'].includes(saved);
        const dark = known
          ? darkBased.includes(saved)
          : matchMedia('(prefers-color-scheme: dark)').matches;
        root.classList.toggle('dark', dark);
        if (palettes.includes(saved)) root.dataset.theme = saved;
      })();
    </script>
    <meta
      name="description"
      content="A retro board for your team. Create one, share the code, and it is gone by morning."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Holocron</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
